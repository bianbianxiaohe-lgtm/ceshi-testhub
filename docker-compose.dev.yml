name: testhub-dev

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testhub_dev}
      MYSQL_USER: ${MYSQL_USER:-testhub_dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dev-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - dev-net
    ports:
      # 端口绑定说明（2026-10-10 改为监听所有网卡）：
      # 原先绑 127.0.0.1，团队同事无法从局域网连这套 dev 数据库。
      # 现改为 0.0.0.0 以便同事用 <本机内网IP>:13306 共用同一套开发库。
      # ⚠️ 安全前提：此端口必须在 Windows 防火墙里限定来源网段（如 192.168.8.0/24），
      #    不要对公网开放。生产库是 testhub-mysql（端口未映射），此处放开的是 dev 库。
      - "${DEV_MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-testhub_dev}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 20
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - dev-redis-data:/data
    networks:
      - dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.5

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      # DB_HOST / DB_PORT 由 .env.dev 提供（团队共用共享开发库 192.168.8.75:13306）
      REDIS_URL: redis://redis:6379/0
      # midscene v1.8.7 要求显式指定模型 family（其 Node 服务从环境变量读取，
      # 不会继承 Python 请求线程里设置的 os.environ）。dashscope 多模态模型 qwen3.7-plus 配 qwen3-vl 协议。
      MIDSCENE_MODEL_FAMILY: qwen3-vl
    volumes:
      - ./apps:/app/apps
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./manage.py:/app/manage.py
      - ./docker_start.py:/app/docker_start.py
      - dev-media:/app/media
      - dev-logs:/app/logs
      - dev-knowledge:/app/knowledge-bases
      - dev-chroma:/app/chroma
      # Midscene 运行时（Node runtime + @midscene/web Node 服务）持久化。
      # 它是首次运行期下载的运行产物（约 350MB），不挂卷的话容器一重建就得重新
      # 下载 Node + npm install（约 5 分钟）。
      # 注：Chrome 不在这里——引擎已改为复用镜像自带的 playwright chromium，
      # 见 apps/ui_automation/midscene_web_engine.py::_find_chrome_executable。
      - dev-midscene:/root/.midscene
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 绑定 0.0.0.0：插着手机的电脑（局域网内其它机器）要能直接
      # POST /api/ui-automation/device-agent/register/ 上报设备，
      # 绑 127.0.0.1 时只能从本机访问。
      - "${DEV_BACKEND_PORT:-18000}:8000"
    mem_limit: 4g
    cpus: 2.0

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - dev-net
    ports:
      - "${DEV_FRONTEND_PORT:-18080}:80"
    mem_limit: 256m
    cpus: 0.5

networks:
  dev-net:
    driver: bridge

volumes:
  dev-mysql-data:
  dev-redis-data:
  dev-media:
  dev-logs:
  dev-knowledge:
  dev-chroma:
  dev-midscene:
