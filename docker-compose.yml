services:

  mysql:
    image: mysql:8.0
    container_name: testhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testhub}
      MYSQL_USER: ${MYSQL_USER:-testhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - testhub-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - testhub-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-testhub}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: testhub-backend
    restart: always
    env_file:
      - .env
    # 非敏感运行配置：显式写在 compose 里，避免被 .env 里的人工改动悄悄覆盖。
    # docker compose 的 environment 优先级高于 env_file，同名键以这里为准。
    # ⚠️ 敏感项（SECRET_KEY / DB_PASSWORD / MYSQL_* / EMAIL_HOST_PASSWORD）只留在 .env，禁止写到这里。
    environment:
      # 生产必须为 False：True 会让 500 错误返回完整 traceback + 全部 settings，
      # 曾因前端轮询无上限叠加导致连接数打满（2026-10-22 事故）。
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,192.168.8.75"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://192.168.8.75:8080"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://192.168.8.75:8080"
      PYTHONUNBUFFERED: "1"
    volumes:
      - testhub-media:/app/media
      - testhub-logs:/app/logs
      - ./knowledge-base:/app/knowledge-bases
      - testhub-chroma-data:/app/chroma
      # Midscene 运行时（Node runtime + @midscene/web Node 服务）。
      # 它是首次运行期下载的运行产物（约数百 MB），不挂卷的话容器一重建就丢，
      # 表现为首次执行要重新下载 Node（生产实测几小时）或直接报找不到 Chrome。
      # 注：Chrome 本身不在这里——引擎已改为复用镜像自带的 playwright chromium，
      # 见 apps/ui_automation/midscene_web_engine.py::_find_chrome_executable。
      - testhub-midscene:/root/.midscene
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - testhub-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: testhub-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - testhub-net

networks:
  testhub-net:
    driver: bridge

volumes:
  testhub-mysql-data:
  testhub-media:
  testhub-logs:
  testhub-chroma-data:
  testhub-midscene:
