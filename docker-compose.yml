services:

  mysql:
    image: mysql:8.0
    container_name: testhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testhub}
      MYSQL_USER: ${MYSQL_USER:-testhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - testhub-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - testhub-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-testhub}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: testhub-backend
    restart: always
    env_file:
      - .env
    volumes:
      - testhub-media:/app/media
      - testhub-logs:/app/logs
      - ./knowledge-base:/app/knowledge-bases
      - testhub-chroma-data:/app/chroma
      # Midscene 运行时（Node runtime + @midscene/web Node 服务）。
      # 它是首次运行期下载的运行产物（约数百 MB），不挂卷的话容器一重建就丢，
      # 表现为首次执行要重新下载 Node（生产实测几小时）或直接报找不到 Chrome。
      # 注：Chrome 本身不在这里——引擎已改为复用镜像自带的 playwright chromium，
      # 见 apps/ui_automation/midscene_web_engine.py::_find_chrome_executable。
      - testhub-midscene:/root/.midscene
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - testhub-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: testhub-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - testhub-net

networks:
  testhub-net:
    driver: bridge

volumes:
  testhub-mysql-data:
  testhub-media:
  testhub-logs:
  testhub-chroma-data:
  testhub-midscene:
